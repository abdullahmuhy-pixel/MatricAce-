<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Main background gradient: deep forest green to rich emerald -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D4F3C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A7A5A;stop-opacity:1" />
    </linearGradient>

    <!-- Gold accent gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5C518;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8A500;stop-opacity:1" />
    </linearGradient>

    <!-- Cap top gradient -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F0E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4C9A8;stop-opacity:1" />
    </linearGradient>

    <!-- Inner glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Subtle shadow on cap -->
    <filter id="capShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <!-- Clip to rounded rect -->
    <clipPath id="roundClip">
      <rect x="0" y="0" width="400" height="400" rx="90" ry="90"/>
    </clipPath>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="400" height="400" rx="90" ry="90" fill="url(#bgGrad)"/>

  <!-- Subtle geometric pattern: faint diagonal lines for texture -->
  <g clip-path="url(#roundClip)" opacity="0.06">
    <line x1="0" y1="400" x2="400" y2="0" stroke="white" stroke-width="60"/>
    <line x1="-100" y1="400" x2="300" y2="0" stroke="white" stroke-width="30"/>
    <line x1="100" y1="400" x2="500" y2="0" stroke="white" stroke-width="30"/>
  </g>

  <!-- Bottom arc: subtle South African inspired arc motif -->
  <ellipse cx="200" cy="430" rx="230" ry="100" fill="none" stroke="white" stroke-width="1.5" opacity="0.12"/>
  <ellipse cx="200" cy="450" rx="270" ry="120" fill="none" stroke="white" stroke-width="1" opacity="0.08"/>

  <!-- === GRADUATION CAP === -->
  <!-- Board (flat diamond top) -->
  <polygon 
    points="200,108  320,162  200,216  80,162" 
    fill="url(#capGrad)" 
    filter="url(#capShadow)"
  />
  <!-- Board shine -->
  <polygon 
    points="200,115  290,158  200,188  110,158" 
    fill="white" 
    opacity="0.08"
  />

  <!-- Cap body (cylinder / head part) -->
  <ellipse cx="200" cy="216" rx="62" ry="14" fill="#1A3A2C"/>
  <rect x="138" y="216" width="124" height="52" fill="#1A3A2C"/>
  <ellipse cx="200" cy="268" rx="62" ry="14" fill="#152E24"/>

  <!-- Cap body highlight -->
  <rect x="138" y="216" width="124" height="10" fill="white" opacity="0.06" rx="2"/>

  <!-- Gold band on cap -->
  <rect x="138" y="256" width="124" height="10" fill="url(#goldGrad)" rx="0"/>
  <ellipse cx="200" cy="256" rx="62" ry="5" fill="url(#goldGrad)"/>
  <ellipse cx="200" cy="266" rx="62" ry="5" fill="#C8960A"/>

  <!-- Tassel string from right corner of board -->
  <line x1="320" y1="162" x2="320" y2="230" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
  <line x1="320" y1="230" x2="304" y2="260" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>

  <!-- Tassel ball -->
  <circle cx="304" cy="263" r="9" fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- Tassel fringe -->
  <line x1="299" y1="272" x2="294" y2="300" stroke="#F5C518" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <line x1="304" y1="272" x2="302" y2="302" stroke="#F5C518" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <line x1="309" y1="272" x2="312" y2="300" stroke="#F5C518" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <line x1="314" y1="270" x2="320" y2="296" stroke="#F5C518" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="295" y1="271" x2="287" y2="296" stroke="#F5C518" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- === "A" ACE LETTER: bold gold, centered below cap === -->
  <!-- Custom geometric "A" mark -->
  <g transform="translate(200, 195)">
    <!-- Subtle "ace" star / diamond pip -->
    <polygon points="0,-16  6,0  0,14  -6,0" fill="url(#goldGrad)" opacity="0.85"/>
  </g>

  <!-- === TEXT === -->
  <!-- "MatricAce" -->
  <text 
    x="200" 
    y="322" 
    font-family="Georgia, 'Times New Roman', serif" 
    font-size="36" 
    font-weight="700" 
    letter-spacing="1.5"
    fill="white" 
    text-anchor="middle"
    dominant-baseline="middle"
  >Matric<tspan fill="url(#goldGrad)">Ace</tspan></text>

  <!-- "SA" badge -->
  <text 
    x="200" 
    y="357" 
    font-family="Georgia, 'Times New Roman', serif" 
    font-size="14" 
    font-weight="400" 
    letter-spacing="5"
    fill="white" 
    text-anchor="middle"
    dominant-baseline="middle"
    opacity="0.7"
  >SOUTH AFRICA</text>

  <!-- Thin gold divider line -->
  <line x1="130" y1="340" x2="270" y2="340" stroke="url(#goldGrad)" stroke-width="1" opacity="0.5"/>
</svg>
